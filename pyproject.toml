[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lanchamp-cotw"
version = "0.1.0"
description = "Add LANChamp Clips of the Week overlays, title card and end card to cs2-highlights output with FFmpeg"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pillow>=10.1",
    "click>=8.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
beats = ["librosa>=0.10"]  # --snap-cuts

[project.scripts]
cotw = "cotw.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cotw = ["fonts/*.ttf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
